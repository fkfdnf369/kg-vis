7", "label": "p227 Step 3: Buy your investment art whe", "title": "Step 3: Buy your investment art when you feel confident of its worth, its price and its ability to grow in value.", "color": "#bdc3c7", "shape": "box", "size": 10, "font": {"size": 8}}, {"id": "P:p17", "label": "p17 Given the high-level task T (e.g. wa", "title": "Given the high-level task T (e.g. watch television in the living room) sampled from a task domain M T (e.g. RobotHow), a procedural planner aims to decompose it into lower-level temporally extended steps S T = {S 1 , ..., S i |S i \u2208 S}. There exists certain admissible plans S, which is a fixed set c", "color": "#bdc3c7", "shape": "box", "size": 10, "font": {"size": 8}}, {"id": "P:p538", "label": "p538 Step 6: Switch on computer\" (2) The", "title": "Step 6: Switch on computer\" (2) The plan predicted by Chain baseline is empty.  (3) The plan predicted by LLMaP baseline is \"Task: Turking.", "color": "#bdc3c7", "shape": "box", "size": 10, "font": {"size": 8}}, {"id": "P:p185", "label": "p185 \u2022 The steps horizon, which constrai", "title": "\u2022 The steps horizon, which constrains the maximal number of procedural planning steps, is searched in {10, 20, 40}. \u2022 The number of hops for retrieving the subgraph from the external knowledge base is searched in {1, 2, 3}. \u2022 The ratio of maximal concepts to the length of the task name is searched i", "color": "#bdc3c7", "shape": "box", "size": 10, "font": {"size": 8}}, {"id": "P:p58", "label": "p58 Baselines We compare our approach wi", "title": "Baselines We compare our approach with three vanilla generative pre-trained language models (BART, GPT2, and GPT3) and two powerful generation baselines (Zero-shot Planner (Huang et al., 2022) noted as \"LLMaP\" and Chain of Thought (Wei et al., 2022) noted as \"Chain\").  More method and configuration ", "color": "#bdc3c7", "shape": "box", "size": 10, "font": {"size": 8}}, {"id": "P:p5", "label": "p5 How to make a cup of coffee? As human", "title": "How to make a cup of coffee? As humans, we can easily specify a procedure to solve this task, using our innate ability of commonsense reasoning.  However, can we endow machines with the same ability to construct a sequential plan? As depicted in Figure 1, procedural planning (Pearson, 1996;Zhang et ", "color": "#bdc3c7", "shape": "box", "size": 10, "font": {"size": 8}}, {"id": "P:p141", "label": "p141 We have Equation 13because of the i", "title": "We have Equation 13because of the intervention on T and Rule 2 (Pearl, 1995), Equation 14because of Rule 1 (Pearl, 1995).  After simplification based on Equation 12-16, we get the SCM at timestep i > 1 in Figure 4c.  This is an equivalent SCM after eliminating P i-1 in Figure 4b.  The reason we coul", "color": "#bdc3c7", "shape": "box", "size": 10, "font": {"size": 8}}, {"id": "P:p20", "label": "p20 We seek to empower the LLMs with the", "title": "We seek to empower the LLMs with the ability to reason cause-effect relations in procedural planning.  Thus, we devise a causal framework by first defining a Structural Causal Model (SCM) of procedural planning in Figure 2.  The SCM describes the temporal dynamics and procedural cause-effect relatio", "color": "#bdc3c7", "shape": "box", "size": 10, "font": {"size": 8}}, {"id": "P:p9", "label": "p9 We conducted experiments on RobotHow ", "title": "We conducted experiments on RobotHow (Puig et al., 2018) and WikiHow (Koupaee & Wang, 2018) under original and counterfactual situations.  Our major contributions can be summarized as:", "color": "#bdc3c7", "shape": "box", "size": 10, "font": {"size": 8}}, {"id": "P:p276", "label": "p276 WikiHow Task: How to Train a Parrot", "title": "WikiHow Task: How to Train a Parrot to Say Something", "color": "#bdc3c7", "shape": "box", "size": 10, "font": {"size": 8}}, {"id": "P:p67", "label": "p67 RobotHow Toast Bread...", "title": "RobotHow Toast Bread", "color": "#bdc3c7", "shape": "box", "size": 10, "font": {"size": 8}}, {"id": "P:p35", "label": "p35 We achieve the do-operation in a pro", "title": "We achieve the do-operation in a prompting way by modifying the goal input so that the model attends to the task-relevant entities.  To implement, we use NLTK to tokenize and pos tag the task text T .  Then we use the noun (e.g. television), noun phrases (e.g. remote control), and verb phrases (e.g.", "color": "#bdc3c7", "shape": "box", "size": 10, "font": {"size": 8}}, {"id": "P:p205", "label": "p205 Table 9: Showcases of procedural st", "title": "Table 9: Showcases of procedural steps predicted by different models with GPT3 as the base LLM on RobotHow.", "color": "#bdc3c7", "shape": "box", "size": 10, "font": {"size": 8}}, {"id": "P:p122", "label": "p122 Causal Intervention There are two t", "title": "Causal Intervention There are two types of operation to control the confounding bias: the backdoor adjustment and the front-door adjustment (Pearl, 2009).  The backdoor adjustment is intractable in our case because it requires the prior distribution of the confounding variables.  On the other hand, ", "color": "#bdc3c7", "shape": "box", "size": 10, "font": {"size": 8}}, {"id": "P:p2", "label": "p2 Procedural planning aims to implement", "title": "Procedural planning aims to implement complex high-level goals by decomposition into simpler low-level steps.  Although procedural planning is a basic skill set for humans in daily life, it remains a challenge for large language models (LLMs) that lack a deep understanding of the cause-effect relati", "color": "#bdc3c7", "shape": "box", "size": 10, "font": {"size": 8}}, {"id": "P:p257", "label": "p257 WikiHow Task: How to Be Good at Imp", "title": "WikiHow Task: How to Be Good at Improvisation", "color": "#bdc3c7", "shape": "box", "size": 10, "font": {"size": 8}}, {"id": "P:p201", "label": "p201 For the coverage metric under the c", "title": "For the coverage metric under the counterfactual setting, the human-provided program is not significantly better than our PLAN.", "color": "#bdc3c7", "shape": "box", "size": 10, "font": {"size": 8}}, {"id": "P:p123", "label": "p123 The pre-trained knowledge (D) in LL", "title": "The pre-trained knowledge (D) in LLMs confounds language models to make biased decisions toward an unreasonable action.  Since the confounder is unobservable, intervention techniques such as back-door (definition in Appendix A.2) adjustment (Hu & Li, 2021;Weber et al., 2020;Yue et al., 2020) are not", "color": "#bdc3c7", "shape": "box", "size": 10, "font": {"size": 8}}, {"id": "P:p14", "label": "p14 As depicted in Figure 1, procedural ", "title": "As depicted in Figure 1, procedural planning requires generating the Plan (e.g., Step 1: Walk to the living room.) conditioned on the Task (e.g., Watch TV).  We first describe the problem definition T denotes the task query, and S i is the sub-goal step at timestep i. D is the unobservable confoundi", "color": "#bdc3c7", "shape": "box", "size": 10, "font": {"size": 8}}, {"id": "P:p498", "label": "p498 RobotHow Final Goal Task: Turn ligh", "title": "RobotHow Final Goal Task: Turn light off and clean", "color": "#bdc3c7", "shape": "box", "size": 10, "font": {"size": 8}}, {"id": "P:p291", "label": "p291 To make human evaluations more intu", "title": "To make human evaluations more intuitive, we provide an additional Success Rate metric to show whether the procedural plans can successfully implement the task, which focus more on the success rate instead of the coverage or the order of the plans.  We show the Success Rate evaluations on the baseli", "color": "#bdc3c7", "shape": "box", "size": 10, "font": {"size": 8}}, {"id": "P:p544", "label": "p544 We hope to de-bias the procedural p", "title": "We hope to de-bias the procedural planning to avoid misleading either humans or robots with daily life instructions, which may result in unsafe situations.  The cultural bias behind these datasets can be a critical issue for future work.  As the ground truth planning steps usually reflect the cultur", "color": "#bdc3c7", "shape": "box", "size": 10, "font": {"size": 8}}, {"id": "P:p111", "label": "p111 Given the limited diversified cultu", "title": "Given the limited diversified cultural background of the dataset we are using from RobotHow and WikiHow, we assume our results may be biased toward a single cultural background.  For instance, given the task \"make breakfeast\", it should take multi-culture into consideration to generate the procedura", "color": "#bdc3c7", "shape": "box", "size": 10, "font": {"size": 8}}, {"id": "P:p23", "label": "p23 Although LLMs have strong general la", "title": "Although LLMs have strong general language intelligence, they still perform poorly in reasoning the cause-effect relations in procedural plans due to a lack of daily life experience.  We propose to elicit the unbiased procedural planning knowledge from the LLMs using the created commonsense-infused ", "color": "#bdc3c7", "shape": "box", "size": 10, "font": {"size": 8}}, {"id": "P:p117", "label": "p117 The Structural Causal Model (SCM) i", "title": "The Structural Causal Model (SCM) is a directed acyclic graph (DAG) to describe the causal relationships within a system Pearl (2009).  In this paper, we refer to the unrolled SCM along the time dimension as the full temporal causal graph, while the rolled-up version is also called the causal summar", "color": "#bdc3c7", "shape": "box", "size": 10, "font": {"size": 8}}, {"id": "P:p200", "label": "p200 Significance Test We provide paired", "title": "Significance Test We provide paired-t test (p\u00a10.05) statistics results for Table 2.  On RobotHow, our PLAN significantly outperforms all baselines on Original-Order(BART) and Counterfactual-Coverage(GPT2).  On WikiHow, our PLAN significantly outperforms all baselines on Original-Coverage(BART, GPT2)", "color": "#bdc3c7", "shape": "box", "size": 10, "font": {"size": 8}}]);
